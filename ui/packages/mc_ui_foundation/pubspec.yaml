name: mc_ui_foundation
description: Shared presentation components for Mod Conductor desktop surfaces.
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: 3.13.2
  flutter: 3.47.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
