name: Linux desktop package

on:
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  package:
    uses: alsi-lawr/package-release-workflows/.github/workflows/package.yml@main
    permissions:
      contents: read
      attestations: write
      id-token: write
    with:
      package_name: modconductor
      dotnet_version: 10.0.400
      dotnet_project_path: src/ModConductor.Engine/ModConductor.Engine.fsproj
      package_smoke_script: tools/smoke-linux-package.py
      package_metadata_finalize_script: tools/finalize-linux-release.py
      package_publish_script: tools/publish-linux.py
      package_publish_matrix: >-
        [{"rid":"linux-x64","runner":"ubuntu-24.04","machine":"x86_64","executable":"artifacts/publish/linux-x64/bin/modconductor","publish_executable":"bin/modconductor","archive_executable":"bin/modconductor","publish_executables":["app/modconductor/mod_conductor","app/modconductor/engine/ModConductor.Engine","app/modconductor/engine/modconductor-loot-helper"]}]
      jreleaser_image: jreleaser/jreleaser-slim:v1.26.0
      jreleaser_config: packaging/jreleaser-linux.yml
      nix_package_name: modconductor
