name: Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.tools/dotnet
      DOTNET_CLI_HOME: ${{ github.workspace }}/.tools/dotnet-cli
      NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget/packages
      PUB_CACHE: ${{ github.workspace }}/.tools/pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check preinstalled Linux desktop prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for tool in clang cmake ninja pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Missing preinstalled Linux build tool: $tool. This job does not install OS prerequisites."
              exit 1
            fi
          done
          if ! pkg-config --print-errors --cflags --libs gtk+-3.0; then
            echo "::error::GTK 3 development metadata or its dependency closure is unavailable. Use a runner with these prerequisites already available; this job will not install them."
            exit 1
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned Flutter SDK locally
        run: python tools/bootstrap-flutter.py
      - name: Add Flutter to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.tools/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore locked engine
        run: dotnet restore ModConductor.slnx --locked-mode
      - name: Restore local tools
        run: dotnet tool restore
      - name: Check F# formatting
        run: dotnet tool run fantomas --check src tests
      - name: Check protocol project formatting
        run: dotnet tool run csharpier check src/ModConductor.Protocol/ModConductor.Protocol.csproj Directory.Packages.props ModConductor.slnx
      - name: Build engine
        run: dotnet build ModConductor.slnx --configuration Release --no-restore
      - name: Publish native storage and filesystem fixtures
        run: dotnet publish tests/ModConductor.Native.Fixtures/ModConductor.Native.Fixtures.fsproj --configuration Release --runtime ${{ runner.os == 'Linux' && 'linux-x64' || 'win-x64' }} --no-restore --output .tools/publish/native-fixtures
      - name: Check native Linux storage and path preflight
        if: runner.os == 'Linux'
        env:
          MC_NATIVE_FIXTURE: ${{ github.workspace }}/.tools/publish/native-fixtures/ModConductor.Native.Fixtures
          MC_SECOND_FIXTURE_ROOT: /dev/shm
          MC_NATIVE_REPORT: ${{ github.workspace }}/.agent-workspace/native-observations.json
        run: dotnet test tests/ModConductor.Native.Tests/ModConductor.Native.Tests.fsproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=native-tests.trx" --results-directory .agent-workspace/test-results
      - name: Check native Windows storage and path preflight
        if: runner.os == 'Windows'
        env:
          MC_NATIVE_FIXTURE: ${{ github.workspace }}/.tools/publish/native-fixtures/ModConductor.Native.Fixtures.exe
          MC_NATIVE_REPORT: ${{ github.workspace }}/.agent-workspace/native-observations.json
        run: dotnet test tests/ModConductor.Native.Tests/ModConductor.Native.Tests.fsproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=native-tests.trx" --results-directory .agent-workspace/test-results
      - name: Restore locked desktop dependencies
        working-directory: ui/apps/mod_conductor
        run: flutter pub get --enforce-lockfile
      - name: Check generated protocol boundaries
        run: python tools/generate-protocol.py --check
      - name: Analyze desktop and shared foundation
        working-directory: ui
        run: flutter analyze --no-pub
      - name: Check Dart formatting
        working-directory: ui
        run: dart format --output=none --set-exit-if-changed apps/mod_conductor/lib apps/mod_conductor/test packages/mc_ui_foundation/lib apps/mod_conductor/integration_test packages/mc_client/lib/mc_client.dart packages/mc_client/lib/src/engine_session.dart packages/mc_client/lib/src/engine_owner.dart packages/mc_client/lib/src/operations_client.dart packages/mc_client/lib/src/workspaces_client.dart packages/mc_client/test packages/mc_workspaces/lib packages/mc_workspaces/test
      - name: Check desktop interactions
        working-directory: ui/apps/mod_conductor
        run: flutter test --no-pub test
      - name: Check workspace presentation
        working-directory: ui/packages/mc_workspaces
        run: flutter test --no-pub
      - name: Publish Linux NativeAOT engine
        if: runner.os == 'Linux'
        run: dotnet publish src/ModConductor.Engine/ModConductor.Engine.fsproj --configuration Release --runtime linux-x64 --self-contained true --no-restore --output .tools/publish/linux-x64
      - name: Publish Windows NativeAOT engine
        if: runner.os == 'Windows'
        run: dotnet publish src/ModConductor.Engine/ModConductor.Engine.fsproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output .tools/publish/win-x64
      - name: Check Linux durable operations and session security
        if: runner.os == 'Linux'
        working-directory: ui/packages/mc_client
        env:
          MC_ENGINE_PATH: ${{ github.workspace }}/.tools/publish/linux-x64/ModConductor.Engine
        run: flutter test --no-pub
      - name: Check native Flutter wire path on private display
        if: runner.os == 'Linux'
        run: python tools/check-linux-wire.py
      - name: Check native Linux folder selection and workspace journey
        if: runner.os == 'Linux'
        run: python tools/check-linux-wire.py --workspaces --output .agent-workspace/workspace-ui
      - name: Check Windows session key cleanup
        if: runner.os == 'Windows'
        run: ./tools/check-windows-session-keys.ps1 -EnginePath "${{ github.workspace }}/.tools/publish/win-x64/ModConductor.Engine.exe"
      - name: Check Windows authenticated wire and cancellation
        if: runner.os == 'Windows'
        working-directory: ui/packages/mc_client
        env:
          MC_ENGINE_PATH: ${{ github.workspace }}/.tools/publish/win-x64/ModConductor.Engine.exe
        run: flutter test --no-pub
      - name: Check native Windows Flutter wire path
        if: runner.os == 'Windows'
        working-directory: ui/apps/mod_conductor
        run: flutter test integration_test/native_wire_test.dart -d windows --no-pub --dart-define=MC_ENGINE_PATH=${{ github.workspace }}/.tools/publish/win-x64/ModConductor.Engine.exe
      - name: Build Linux desktop
        if: runner.os == 'Linux'
        working-directory: ui/apps/mod_conductor
        run: flutter build linux --release --no-pub
      - name: Build Windows desktop
        if: runner.os == 'Windows'
        working-directory: ui/apps/mod_conductor
        run: flutter build windows --release --no-pub
      - name: Assemble development bundle
        run: python tools/assemble-development.py
