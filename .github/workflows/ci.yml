name: Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget/packages
      PUB_CACHE: ${{ github.workspace }}/.tools/pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install Linux desktop build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Install pinned Flutter SDK locally
        run: python tools/bootstrap-flutter.py
      - name: Add Flutter to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.tools/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore locked engine
        run: dotnet restore ModConductor.slnx --locked-mode
      - name: Restore local tools
        run: dotnet tool restore
      - name: Check F# formatting
        run: dotnet tool run fantomas --check src
      - name: Build engine
        run: dotnet build ModConductor.slnx --configuration Release --no-restore
      - name: Restore locked desktop dependencies
        working-directory: ui/apps/mod_conductor
        run: flutter pub get --enforce-lockfile
      - name: Analyze desktop
        working-directory: ui/apps/mod_conductor
        run: flutter analyze --no-pub
      - name: Check Dart formatting
        working-directory: ui/apps/mod_conductor
        run: dart format --output=none --set-exit-if-changed lib
      - name: Build Linux desktop
        if: runner.os == 'Linux'
        working-directory: ui/apps/mod_conductor
        run: flutter build linux --release --no-pub
      - name: Build Windows desktop
        if: runner.os == 'Windows'
        working-directory: ui/apps/mod_conductor
        run: flutter build windows --release --no-pub
