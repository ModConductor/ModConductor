syntax = "proto3";
package modconductor.v2;
option csharp_namespace = "ModConductor.Protocol.V2";

// Every RPC requires the capability from the private child bootstrap.
service EngineOperations {
  rpc GetState(StateRequest) returns (OperationBatch);
  rpc BeginRuntimeCheck(RuntimeCheckRequest) returns (OperationSnapshot);
  rpc GetOperation(OperationIdentity) returns (OperationSnapshot);
  rpc CancelOperation(OperationIdentity) returns (OperationSnapshot);
  rpc WatchOperations(WatchRequest) returns (stream OperationBatch);
}
message StateRequest { uint32 protocol_major = 1; }
message RuntimeCheckRequest {
  // Canonical UUID without separators. It fixes the complete request across restarts.
  string operation_id = 1;
  // Version of committed runtime results, not the progress cursor. Initial version is zero.
  uint64 expected_revision = 2;
  // Required 1..16. This preserves the existing bounded heartbeat connection check.
  uint32 heartbeat_count = 3;
}
message OperationIdentity { string operation_id = 1; }
message WatchRequest {
  // Omission asks for a current snapshot. An old/future cursor explicitly requests resync.
  optional uint64 after_cursor = 1;
}
enum OperationPhase {
  OPERATION_PHASE_UNSPECIFIED = 0;
  OPERATION_PHASE_RUNNING = 1;
  OPERATION_PHASE_COMPLETED = 2;
  OPERATION_PHASE_CANCELLED = 3;
  OPERATION_PHASE_INTERRUPTED = 4;
  OPERATION_PHASE_STALE = 5;
}
message RuntimeInfo {
  string architecture = 1;
  bool native_aot = 2;
  string sqlite_version = 3;
}
message OperationSnapshot {
  string operation_id = 1;
  uint64 expected_revision = 2;
  uint32 heartbeat_count = 3;
  OperationPhase phase = 4;
  uint32 progress = 5;
  RuntimeInfo result = 6;
  // Nonzero only for a completed result. Replay and cancellation do not advance it.
  uint64 result_revision = 7;
}
message OperationChange {
  uint64 cursor = 1;
  OperationSnapshot operation = 2;
}
message OperationBatch {
  uint64 cursor = 1;
  uint64 revision = 2;
  bool resync_required = 3;
  // Initial/reconnect or gap response. Latest 16 operations; older IDs remain queryable.
  bool has_snapshot = 4;
  repeated OperationSnapshot snapshot = 5;
  // At most 16 ordered changes. The durable window retains the latest 128 changes.
  repeated OperationChange changes = 6;
}
// Public descriptor on the owned stdout pipe, not a network RPC.
message EngineReady {
  uint32 protocol_major = 1;
  uint32 port = 2;
  bytes certificate_pem = 3;
}
// Removed fields must be reserved, never reused. Incompatible changes require a new major.

service WorkspaceOperations {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (WorkspaceReply);
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (WorkspaceReply);
  rpc ReadWorkspace(ReadWorkspaceRequest) returns (WorkspaceReply);
  rpc EditProfile(EditProfileRequest) returns (ProfileReply);
  rpc CheckWorkspace(CheckWorkspaceRequest) returns (WorkspaceReply);
  rpc RecentWorkspaces(RecentWorkspacesRequest) returns (RecentWorkspacesReply);
}
message ProfileInfo { string profile_id = 1; string name = 2; }
enum WorkspaceRootIssueReason {
  WORKSPACE_ROOT_ISSUE_REASON_UNSPECIFIED = 0;
  WORKSPACE_ROOT_ISSUE_REASON_INCOMPLETE_CREATION = 1;
  WORKSPACE_ROOT_ISSUE_REASON_OWNERSHIP_UNPROVED = 2;
  WORKSPACE_ROOT_ISSUE_REASON_IDENTITY_UNVERIFIED = 3;
}
message PendingWorkspaceRoot { uint64 receipt_revision = 1; WorkspaceRootIssueReason reason = 2; }
message WorkspaceInfo {
  string workspace_id = 1;
  string name = 2;
  string path = 3;
  // Workspace metadata revision; independent of runtime-result and root-receipt revisions.
  uint64 revision = 4;
  ProfileInfo selected_profile = 5;
  PendingWorkspaceRoot pending_root = 6;
}
message WorkspacePage {
  WorkspaceInfo workspace = 1;
  // At most 32 profiles, in stable ID order. A cursor permits the next page.
  repeated ProfileInfo profiles = 2;
  optional string next_profile_id = 3;
}
enum WorkspaceFaultCode {
  WORKSPACE_FAULT_CODE_UNSPECIFIED = 0;
  WORKSPACE_FAULT_CODE_NOT_FOUND = 1;
  WORKSPACE_FAULT_CODE_STALE_REVISION = 2;
  WORKSPACE_FAULT_CODE_IDENTITY_CONFLICT = 3;
  WORKSPACE_FAULT_CODE_SELECTED_PROFILE = 4;
  WORKSPACE_FAULT_CODE_INVALID_NAME = 5;
  WORKSPACE_FAULT_CODE_INVALID_ROOT = 6;
  WORKSPACE_FAULT_CODE_ROOT_UNRESOLVED = 7;
  WORKSPACE_FAULT_CODE_BUSY = 8;
}
message WorkspaceFault { WorkspaceFaultCode code = 1; string detail = 2; }
message WorkspaceReply { oneof outcome { WorkspacePage page = 1; WorkspaceFault fault = 2; } }
message CreateWorkspaceRequest { string workspace_id = 1; string name = 2; string path = 3; uint64 expected_revision = 4; }
message OpenWorkspaceRequest { string path = 1; }
message ReadWorkspaceRequest { string workspace_id = 1; optional string after_profile_id = 2; }
message CloneProfile { string source_profile_id = 1; ProfileInfo copy = 2; }
message EditProfileRequest {
  string workspace_id = 1;
  uint64 expected_revision = 2;
  oneof edit {
    ProfileInfo create_profile = 3;
    CloneProfile clone_profile = 4;
    ProfileInfo rename_profile = 5;
    string select_profile_id = 6;
    string delete_profile_id = 7;
  }
}
message ProfileChange {
  WorkspaceInfo workspace = 1;
  ProfileInfo changed = 2;
  optional string deleted_profile_id = 3;
}
message ProfileReply { oneof outcome { ProfileChange change = 1; WorkspaceFault fault = 2; } }
message CheckWorkspaceRequest { string workspace_id = 1; uint64 expected_receipt_revision = 2; }
message RecentWorkspacesRequest { optional string after_workspace_id = 1; }
message RecentWorkspacesReply {
  // At most 8 registered roots. Presence is not a fresh filesystem validation.
  repeated WorkspaceInfo workspaces = 1;
  optional string next_workspace_id = 2;
}
