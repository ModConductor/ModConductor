syntax = "proto3";
package modconductor.v2;
option csharp_namespace = "ModConductor.Protocol.V2";

// Every RPC requires the capability from the private child bootstrap.
service EngineOperations {
  rpc GetState(StateRequest) returns (OperationBatch);
  rpc BeginRuntimeCheck(RuntimeCheckRequest) returns (OperationSnapshot);
  rpc GetOperation(OperationIdentity) returns (OperationSnapshot);
  rpc CancelOperation(OperationIdentity) returns (OperationSnapshot);
  rpc WatchOperations(WatchRequest) returns (stream OperationBatch);
}
message StateRequest { uint32 protocol_major = 1; }
message RuntimeCheckRequest {
  // Canonical UUID without separators. It fixes the complete request across restarts.
  string operation_id = 1;
  // Version of committed runtime results, not the progress cursor. Initial version is zero.
  uint64 expected_revision = 2;
  // Required 1..16. This preserves the existing bounded heartbeat connection check.
  uint32 heartbeat_count = 3;
}
message OperationIdentity { string operation_id = 1; }
message WatchRequest {
  // Omission asks for a current snapshot. An old/future cursor explicitly requests resync.
  optional uint64 after_cursor = 1;
}
enum OperationPhase {
  OPERATION_PHASE_UNSPECIFIED = 0;
  OPERATION_PHASE_RUNNING = 1;
  OPERATION_PHASE_COMPLETED = 2;
  OPERATION_PHASE_CANCELLED = 3;
  OPERATION_PHASE_INTERRUPTED = 4;
  OPERATION_PHASE_STALE = 5;
}
message RuntimeInfo {
  string architecture = 1;
  bool native_aot = 2;
  string sqlite_version = 3;
}
message OperationSnapshot {
  string operation_id = 1;
  uint64 expected_revision = 2;
  uint32 heartbeat_count = 3;
  OperationPhase phase = 4;
  uint32 progress = 5;
  RuntimeInfo result = 6;
  // Nonzero only for a completed result. Replay and cancellation do not advance it.
  uint64 result_revision = 7;
}
message OperationChange {
  uint64 cursor = 1;
  OperationSnapshot operation = 2;
}
message OperationBatch {
  uint64 cursor = 1;
  uint64 revision = 2;
  bool resync_required = 3;
  // Initial/reconnect or gap response. Latest 16 operations; older IDs remain queryable.
  bool has_snapshot = 4;
  repeated OperationSnapshot snapshot = 5;
  // At most 16 ordered changes. The durable window retains the latest 128 changes.
  repeated OperationChange changes = 6;
}
// Public descriptor on the owned stdout pipe, not a network RPC.
message EngineReady {
  uint32 protocol_major = 1;
  uint32 port = 2;
  bytes certificate_pem = 3;
}
// Removed fields must be reserved, never reused. Incompatible changes require a new major.

service WorkspaceOperations {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (WorkspaceReply);
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (WorkspaceReply);
  rpc ReadWorkspace(ReadWorkspaceRequest) returns (WorkspaceReply);
  rpc EditProfile(EditProfileRequest) returns (ProfileReply);
  rpc CheckWorkspace(CheckWorkspaceRequest) returns (WorkspaceReply);
  rpc RecentWorkspaces(RecentWorkspacesRequest) returns (RecentWorkspacesReply);
}
message ProfileInfo { string profile_id = 1; string name = 2; }
enum WorkspaceRootIssueReason {
  WORKSPACE_ROOT_ISSUE_REASON_UNSPECIFIED = 0;
  WORKSPACE_ROOT_ISSUE_REASON_INCOMPLETE_CREATION = 1;
  WORKSPACE_ROOT_ISSUE_REASON_OWNERSHIP_UNPROVED = 2;
  WORKSPACE_ROOT_ISSUE_REASON_IDENTITY_UNVERIFIED = 3;
}
message PendingWorkspaceRoot { uint64 receipt_revision = 1; WorkspaceRootIssueReason reason = 2; }
message WorkspaceInfo {
  string workspace_id = 1;
  string name = 2;
  string path = 3;
  // Workspace metadata revision; independent of runtime-result and root-receipt revisions.
  uint64 revision = 4;
  ProfileInfo selected_profile = 5;
  PendingWorkspaceRoot pending_root = 6;
}
message WorkspacePage {
  WorkspaceInfo workspace = 1;
  // At most 32 profiles, in stable ID order. A cursor permits the next page.
  repeated ProfileInfo profiles = 2;
  optional string next_profile_id = 3;
}
enum WorkspaceFaultCode {
  WORKSPACE_FAULT_CODE_UNSPECIFIED = 0;
  WORKSPACE_FAULT_CODE_NOT_FOUND = 1;
  WORKSPACE_FAULT_CODE_STALE_REVISION = 2;
  WORKSPACE_FAULT_CODE_IDENTITY_CONFLICT = 3;
  WORKSPACE_FAULT_CODE_SELECTED_PROFILE = 4;
  WORKSPACE_FAULT_CODE_INVALID_NAME = 5;
  WORKSPACE_FAULT_CODE_INVALID_ROOT = 6;
  WORKSPACE_FAULT_CODE_ROOT_UNRESOLVED = 7;
  WORKSPACE_FAULT_CODE_BUSY = 8;
}
message WorkspaceFault { WorkspaceFaultCode code = 1; string detail = 2; }
message WorkspaceReply { oneof outcome { WorkspacePage page = 1; WorkspaceFault fault = 2; } }
message CreateWorkspaceRequest { string workspace_id = 1; string name = 2; string path = 3; uint64 expected_revision = 4; }
message OpenWorkspaceRequest { string path = 1; }
message ReadWorkspaceRequest { string workspace_id = 1; optional string after_profile_id = 2; }
message CloneProfile { string source_profile_id = 1; ProfileInfo copy = 2; }
message EditProfileRequest {
  string workspace_id = 1;
  uint64 expected_revision = 2;
  oneof edit {
    ProfileInfo create_profile = 3;
    CloneProfile clone_profile = 4;
    ProfileInfo rename_profile = 5;
    string select_profile_id = 6;
    string delete_profile_id = 7;
  }
}
message ProfileChange {
  WorkspaceInfo workspace = 1;
  ProfileInfo changed = 2;
  optional string deleted_profile_id = 3;
}
message ProfileReply { oneof outcome { ProfileChange change = 1; WorkspaceFault fault = 2; } }
message CheckWorkspaceRequest { string workspace_id = 1; uint64 expected_receipt_revision = 2; }
message RecentWorkspacesRequest { optional string after_workspace_id = 1; }
message RecentWorkspacesReply {
  // At most 8 registered roots. Presence is not a fresh filesystem validation.
  repeated WorkspaceInfo workspaces = 1;
  optional string next_workspace_id = 2;
}

// Workspace-owned directory inventory. No archive, deployment or game-folder actions.
service ModLibraryOperations {
  rpc RegisterMod(RegisterModRequest) returns (ModReply);
  rpc EditMod(EditModRequest) returns (ModReply);
  rpc ReadInventory(ReadInventoryRequest) returns (InventoryReply);
  rpc ScanInventory(ScanInventoryRequest) returns (InventoryScanReply);
  rpc PublishMod(PublishModRequest) returns (ModReply);
  rpc ReadPublication(PublicationRequest) returns (PublicationReply);
  rpc CancelPublication(PublicationRequest) returns (PublicationReply);
  rpc ReadModVersion(ReadModVersionRequest) returns (ModVersionReply);
  rpc ReadModPayload(ReadModPayloadRequest) returns (ModPayloadReply);
}
message ModLogicalPath { repeated string components = 1; }
enum InventoryModKind {
  INVENTORY_MOD_KIND_UNSPECIFIED = 0;
  INVENTORY_MOD_KIND_REGULAR = 1;
  INVENTORY_MOD_KIND_SEPARATOR = 2;
  INVENTORY_MOD_KIND_BACKUP = 3;
  INVENTORY_MOD_KIND_UNMANAGED = 4;
  INVENTORY_MOD_KIND_GENERATED_OUTPUT = 5;
}
enum ModInventoryStatus {
  MOD_INVENTORY_STATUS_UNSPECIFIED = 0;
  MOD_INVENTORY_STATUS_READY = 1;
  MOD_INVENTORY_STATUS_DETACHED = 2;
  MOD_INVENTORY_STATUS_CHANGED = 3;
  MOD_INVENTORY_STATUS_UNPROVED = 4;
  MOD_INVENTORY_STATUS_PUBLISHING = 5;
}
enum InventoryModAction {
  INVENTORY_MOD_ACTION_UNSPECIFIED = 0;
  INVENTORY_MOD_ACTION_EDIT_METADATA = 1;
  INVENTORY_MOD_ACTION_PUBLISH = 2;
  INVENTORY_MOD_ACTION_READ_VERSION = 3;
}
message InventoryModMetadata { string name = 1; string notes = 2; string comment = 3; string version = 4; string source = 5; string category = 6; }
message InventoryMod {
  string mod_id = 1; string workspace_id = 2; InventoryModKind kind = 3;
  InventoryModMetadata metadata = 4;
  // Per-mod metadata/current-version revision, independent of workspace/runtime revisions.
  uint64 revision = 5;
  ModLogicalPath source_path = 6;
  optional string current_version_id = 7;
  ModInventoryStatus status = 8;
  repeated InventoryModAction actions = 9;
}
enum ModLibraryFaultCode {
  MOD_LIBRARY_FAULT_CODE_UNSPECIFIED = 0;
  MOD_LIBRARY_FAULT_CODE_NOT_FOUND = 1;
  MOD_LIBRARY_FAULT_CODE_STALE_REVISION = 2;
  MOD_LIBRARY_FAULT_CODE_IDENTITY_CONFLICT = 3;
  MOD_LIBRARY_FAULT_CODE_INVALID_METADATA = 4;
  MOD_LIBRARY_FAULT_CODE_INVALID_SOURCE = 5;
  MOD_LIBRARY_FAULT_CODE_UNPROVED_OWNERSHIP = 6;
  MOD_LIBRARY_FAULT_CODE_SOURCE_CHANGED = 7;
  MOD_LIBRARY_FAULT_CODE_UNSUPPORTED_ACTION = 8;
  MOD_LIBRARY_FAULT_CODE_BUSY = 9;
  MOD_LIBRARY_FAULT_CODE_LIMIT_EXCEEDED = 10;
  MOD_LIBRARY_FAULT_CODE_FILE_UNAVAILABLE = 11;
  MOD_LIBRARY_FAULT_CODE_CANCELLED = 12;
}
message ModLibraryFault { ModLibraryFaultCode code = 1; string detail = 2; }
message ModReply { oneof outcome { InventoryMod mod = 1; ModLibraryFault fault = 2; } }
message RegisterModRequest {
  string workspace_id = 1; string mod_id = 2; InventoryModMetadata metadata = 3;
  InventoryModKind kind = 4; ModLogicalPath source_path = 5; optional string backup_version_id = 6;
}
message EditModRequest { string mod_id = 1; uint64 expected_revision = 2; InventoryModMetadata metadata = 3; }
message ReadInventoryRequest { string profile_id = 1; optional string after_mod_id = 2; }
message ModInventoryPage { repeated InventoryMod entries = 1; optional string next_mod_id = 2; } // At most 32, stable ID order.
message InventoryReply { oneof outcome { ModInventoryPage page = 1; ModLibraryFault fault = 2; } }
message ScanInventoryRequest { string workspace_id = 1; uint32 candidate_limit = 2; }
message UnmanagedModPath { ModLogicalPath path = 1; bool directory = 2; bool unsupported = 3; }
message ModInventoryScan {
  // Bounded summary (32 each), not a complete inventory. ReadInventory pages persisted entries.
  repeated InventoryMod entries = 1; repeated UnmanagedModPath unmanaged = 2; bool limited = 3;
}
message InventoryScanReply { oneof outcome { ModInventoryScan scan = 1; ModLibraryFault fault = 2; } }
message PublishModRequest { string mod_id = 1; uint64 expected_revision = 2; string version_id = 3; }
message PublicationRequest { string version_id = 1; }
enum ModPublicationPhase {
  MOD_PUBLICATION_PHASE_UNSPECIFIED = 0;
  MOD_PUBLICATION_PHASE_INTENT = 1;
  MOD_PUBLICATION_PHASE_OBSERVED = 2;
  MOD_PUBLICATION_PHASE_COMPLETE = 3;
  MOD_PUBLICATION_PHASE_INTERRUPTED = 4;
  MOD_PUBLICATION_PHASE_CANCELLED = 5;
}
message ModPublicationReceipt { string version_id = 1; string mod_id = 2; uint64 expected_revision = 3; ModPublicationPhase phase = 4; }
message PublicationReply { oneof outcome { ModPublicationReceipt receipt = 1; ModLibraryFault fault = 2; } }
message ReadModVersionRequest { string version_id = 1; uint32 offset = 2; }
message ModPayload { string payload_id = 1; uint64 length = 2; string sha256 = 3; }
message ModManifestEntry { ModLogicalPath path = 1; ModPayload payload = 2; }
message ModVersionPage {
  string version_id = 1; string mod_id = 2;
  repeated ModManifestEntry entries = 3; // At most 64; immutable original logical paths.
  optional uint32 next_offset = 4;
}
message ModVersionReply { oneof outcome { ModVersionPage version = 1; ModLibraryFault fault = 2; } }
message ReadModPayloadRequest { string version_id = 1; string payload_id = 2; uint64 offset = 3; uint32 count = 4; } // Count 1..65536.
message ModPayloadReply { oneof outcome { bytes data = 1; ModLibraryFault fault = 2; } }
