syntax = "proto3";
package modconductor.v1;
option csharp_namespace = "ModConductor.Protocol.V1";

// Secret bytes never cross this boundary. Saved presence is not authentication.
service CredentialStorage {
  rpc ReadCredentialStatus(CredentialStatusRequest) returns (CredentialStorageStatus);
  rpc SetCredentialStorageMode(CredentialModeRequest) returns (CredentialStorageStatus);
  rpc RemoveSavedCredentials(CredentialStatusRequest) returns (CredentialStorageStatus);
}
message CredentialStatusRequest {}
enum CredentialStorageMode {
  CREDENTIAL_STORAGE_MODE_UNSPECIFIED = 0;
  CREDENTIAL_STORAGE_MODE_SECURE = 1;
  CREDENTIAL_STORAGE_MODE_SESSION_ONLY = 2;
}
enum CredentialStorageKind {
  CREDENTIAL_STORAGE_KIND_UNSPECIFIED = 0;
  CREDENTIAL_STORAGE_KIND_SECRET_SERVICE = 1;
  CREDENTIAL_STORAGE_KIND_WINDOWS = 2;
  CREDENTIAL_STORAGE_KIND_UNAVAILABLE = 3;
}
enum CredentialPresence {
  CREDENTIAL_PRESENCE_UNSPECIFIED = 0;
  CREDENTIAL_PRESENCE_PRESENT = 1;
  CREDENTIAL_PRESENCE_ABSENT = 2;
  CREDENTIAL_PRESENCE_UNKNOWN = 3;
}
enum CredentialStorageProblem {
  CREDENTIAL_STORAGE_PROBLEM_NONE = 0;
  CREDENTIAL_STORAGE_PROBLEM_UNAVAILABLE = 1;
  CREDENTIAL_STORAGE_PROBLEM_LOCKED = 2;
  CREDENTIAL_STORAGE_PROBLEM_DENIED = 3;
  CREDENTIAL_STORAGE_PROBLEM_TIMED_OUT = 4;
  CREDENTIAL_STORAGE_PROBLEM_CANCELLED = 5;
  CREDENTIAL_STORAGE_PROBLEM_TOO_LARGE = 6;
  CREDENTIAL_STORAGE_PROBLEM_FAILED = 7;
}
message CredentialModeRequest { CredentialStorageMode mode = 1; }
message CredentialStorageStatus {
  CredentialStorageKind storage = 1;
  CredentialStorageMode mode = 2;
  CredentialPresence saved = 3;
  bool has_session = 4;
  CredentialStorageProblem problem = 5;
  CredentialStorageProblem removal_problem = 6;
  string diagnostic_report = 7;
}
