syntax = "proto3";
package modconductor.v1;
option csharp_namespace = "ModConductor.Protocol.V1";
import "modconductor/v1/artifacts.proto";

service Nexus {
  rpc ReadNexusStatus(NexusStatusRequest) returns (NexusAccountStatus);
  rpc BeginNexusSignIn(NexusStatusRequest) returns (NexusAccountStatus);
  rpc CancelNexusSignIn(NexusStatusRequest) returns (NexusAccountStatus);
  rpc ConnectNexus(NexusStatusRequest) returns (NexusAccountStatus);
  rpc CheckNexusAccount(NexusStatusRequest) returns (NexusAccountStatus);
  rpc SubmitNexusPersonalApiKey(NexusPersonalApiKeyRequest) returns (NexusAccountStatus);
  rpc ReadNexusMod(NexusModRequest) returns (NexusModReply);
  rpc DownloadNexusFile(NexusDownloadRequest) returns (NexusDownloadReply);
  rpc OpenNexusModPage(NexusModRequest) returns (NexusStatusRequest);
}
message NexusStatusRequest {}
message NexusPersonalApiKeyRequest { string api_key = 1; }
message NexusFailure { string code = 1; string message = 2; optional int64 retry_at_unix_ms = 3; }
message NexusAccountStatus {
  bool configured = 1;
  bool waiting = 2;
  optional string account_name = 3;
  optional bool premium = 4;
  optional NexusFailure failure = 5;
  optional string profile_image_url = 6;
}
message NexusModRequest { string workspace_id = 1; int64 mod_id = 2; string profile_id = 3; }
message NexusFileInfo {
  int64 id = 1;
  string name = 2;
  string version = 3;
  string category = 4;
  string description = 5;
  optional int64 bytes = 6;
}
message NexusModInfo { int64 id = 1; string name = 2; string summary = 3; repeated NexusFileInfo files = 4; }
message NexusModReply { oneof result { NexusModInfo mod = 1; NexusFailure failure = 2; } }
message NexusDownloadRequest { string workspace_id = 1; string artifact_id = 2; int64 mod_id = 3; int64 file_id = 4; string profile_id = 5; }
message NexusDownloadReply { oneof result { ArchiveArtifact artifact = 1; NexusFailure failure = 2; } }
