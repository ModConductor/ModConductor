syntax = "proto3";
package modconductor.v1;
option csharp_namespace = "ModConductor.Protocol.V1";

enum MigrationManager {
  MIGRATION_MANAGER_UNSPECIFIED = 0;
  MIGRATION_MANAGER_MOD_ORGANIZER = 1;
  MIGRATION_MANAGER_VORTEX = 2;
}

message MigrationRequest {
  string workspace_id = 1;
  MigrationManager manager = 2;
  string source_folder = 3;
  string profile_id = 4;
  string staging_root = 5;
  string download_root = 6;
}

message ProfileRequest {
  MigrationManager manager = 1;
  string source_file = 2;
}

message BackupProfile {
  string id = 1;
  string name = 2;
  string game_id = 3;
}

message ProfileList {
  repeated BackupProfile profiles = 1;
  MigrationError error = 2;
}

message MigrationProgress {
  uint32 completed = 1;
  uint32 total = 2;
  string message = 3;
}

enum MigrationErrorCode {
  MIGRATION_ERROR_CODE_UNSPECIFIED = 0;
  MIGRATION_ERROR_CODE_INVALID_SOURCE = 1;
  MIGRATION_ERROR_CODE_TARGET_NOT_EMPTY = 2;
  MIGRATION_ERROR_CODE_UNSAFE_SOURCE = 3;
  MIGRATION_ERROR_CODE_CASE_COLLISION = 4;
  MIGRATION_ERROR_CODE_UNSUPPORTED_DATA = 5;
  MIGRATION_ERROR_CODE_SOURCE_CHANGED = 6;
  MIGRATION_ERROR_CODE_CANCELLED = 7;
  MIGRATION_ERROR_CODE_BUSY = 8;
  MIGRATION_ERROR_CODE_UNAVAILABLE = 9;
}

message MigrationError {
  MigrationErrorCode code = 1;
  string detail = 2;
}

message MigrationResult {
  string workspace_id = 1;
  uint32 profiles = 2;
  uint32 mods = 3;
  uint32 artifacts = 4;
}

message MigrationEvent {
  oneof event {
    MigrationProgress progress = 1;
    MigrationError error = 2;
    MigrationResult result = 3;
  }
}

service MigrationOperations {
  rpc Profiles(ProfileRequest) returns (ProfileList);
  rpc Migrate(MigrationRequest) returns (stream MigrationEvent);
}
