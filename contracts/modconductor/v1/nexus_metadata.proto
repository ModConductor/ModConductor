syntax = "proto3";
package modconductor.v1;
option csharp_namespace = "ModConductor.Protocol.V1";
import "modconductor/v1/nexus.proto";

service NexusMetadata {
  rpc ReadModNexus(ModNexusRequest) returns (ModNexusReply);
  rpc RefreshModNexus(ModNexusReference) returns (ModNexusReply);
  rpc LinkModNexus(LinkModNexusRequest) returns (ModNexusReply);
  rpc MapModNexusCategory(MapModNexusCategoryRequest) returns (ModNexusReply);
  rpc DownloadModNexusFile(DownloadModNexusFileRequest) returns (NexusDownloadReply);
}
message ModNexusRequest { string workspace_id=1; string mod_id=2; }
message ModNexusReference { string workspace_id=1; string mod_id=2; int64 link_revision=3; string version_id=4; optional int64 provider_mod=5; int64 mod_revision=6; }
message NexusMetadataFile { NexusFileInfo file=1; int32 category_id=2; optional int64 uploaded_unix_ms=3; bool update_candidate=4; }
message NexusPublicMetadata {
  string name=1; string summary=2; string version=3; string author=4; string uploader=5;
  optional int64 category_id=6; string category=7; optional int64 modified_unix_ms=8;
  bool available=9; bool allows_rating=10; repeated NexusMetadataFile files=11;
}
message ModNexusDetails {
  ModNexusReference reference=1; string local_name=2;
  optional int64 installed_file=3; string installed_version=4; bool linked_manually=5;
  optional NexusPublicMetadata metadata=6;
  string freshness=7; optional int64 checked_unix_ms=8; string problem=9;
  optional string category_id=10; string category=11;
}
message ModNexusReply { oneof result { ModNexusDetails details=1; NexusFailure failure=2; } }
message LinkModNexusRequest { ModNexusReference reference=1; optional int64 provider_mod=2; optional int64 file_id=3; }
message MapModNexusCategoryRequest { ModNexusReference reference=1; string category_id=2; int64 provider_category_id=3; }
message DownloadModNexusFileRequest { ModNexusReference reference=1; int64 file_id=2; bool update_only=3; string artifact_id=4; }
