syntax = "proto3";
package modconductor.v1;
option csharp_namespace = "ModConductor.Protocol.V1";
service ModDeletion {
  rpc PrepareModDeletion(PrepareModDeletionRequest) returns (ModDeletionPreview);
  rpc CloseModDeletionPreview(ModDeletionReference) returns (ModDeletionPreviewClosed);
  rpc StartModDeletion(StartModDeletionRequest) returns (ModDeletionStatus);
  rpc ContinueModDeletion(ModDeletionReference) returns (ModDeletionStatus);
  rpc RecentModDeletions(ModDeletionWorkspace) returns (ModDeletionList);
  rpc WatchModDeletion(ModDeletionReference) returns (stream ModDeletionStatus);
}
message PrepareModDeletionRequest { string workspace_id = 1; string mod_id = 2; uint64 revision = 3; }
message ModDeletionReference { string workspace_id = 1; string id = 2; }
message ModDeletionWorkspace { string workspace_id = 1; }
message ModDeletionPreviewClosed {}
message StartModDeletionRequest { string workspace_id = 1; string preview_id = 2; string id = 3; }
enum ModDeletionFileKind { MOD_DELETION_FILE_KIND_PAYLOAD = 0; MOD_DELETION_FILE_KIND_ARCHIVE = 1; MOD_DELETION_FILE_KIND_TEMPORARY = 2; MOD_DELETION_FILE_KIND_GENERATION_LINK = 3; }
message ModDeletionFile { string label = 1; ModDeletionFileKind kind = 2; optional uint64 bytes = 3; bool shared = 4; }
message ModDeletionProfile { string id = 1; string name = 2; }
message ModDeletionDeployment { string context_id = 1; string id = 2; string name = 3; optional int64 prepared_at_unix_ms = 4; bool active = 5; }
message ModDeletionPreview {
  string id = 1;
  string workspace_id = 2;
  string mod_id = 3;
  uint64 revision = 4;
  string name = 5;
  uint32 versions = 6;
  repeated string backups = 7;
  repeated ModDeletionProfile profiles = 8;
  repeated ModDeletionDeployment deployments = 9;
  repeated ModDeletionFile files = 10;
  repeated string external = 11;
  optional string blocked = 12;
}
enum ModDeletionPhase { MOD_DELETION_PHASE_RUNNING = 0; MOD_DELETION_PHASE_INCOMPLETE = 1; MOD_DELETION_PHASE_COMPLETE = 2; }
message ModDeletionStatus { string id = 1; string workspace_id = 2; string mod_id = 3; string name = 4; ModDeletionPhase phase = 5; uint32 remaining = 6; optional string problem = 7; }
message ModDeletionList { repeated ModDeletionStatus entries = 1; }
