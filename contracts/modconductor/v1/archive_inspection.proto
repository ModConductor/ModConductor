syntax = "proto3";
package modconductor.v1;
option csharp_namespace = "ModConductor.Protocol.V1";
import "modconductor/v1/artifacts.proto";
import "modconductor/v1/file_plans.proto";
service ArchiveInspection {
  rpc InspectArchive(ArtifactReference) returns (InspectedArchive);
  rpc PreviewArchiveEntry(PreviewArchiveEntryRequest) returns (FilePreviewReply);
}
message InspectedArchive {
  string sha256 = 1;
  string format = 2;
  repeated InspectedArchiveEntry entries = 3;
  uint64 total_size = 4;
}
message InspectedArchiveEntry {
  uint32 index = 1;
  repeated string components = 2;
  bool directory = 3;
  uint64 size = 4;
  optional uint64 compressed_size = 5;
}

message PreviewArchiveEntryRequest {
  ArtifactReference artifact = 1; string sha256 = 2; string format = 3; InspectedArchiveEntry entry = 4;
  FilePreviewRepresentation representation = 5;
}
