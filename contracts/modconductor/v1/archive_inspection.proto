syntax = "proto3";
package modconductor.v1;
option csharp_namespace = "ModConductor.Protocol.V1";
import "modconductor/v1/artifacts.proto";
service ArchiveInspection {
  rpc InspectArchive(ArtifactReference) returns (InspectedArchive);
}
message InspectedArchive {
  string sha256 = 1;
  string format = 2;
  repeated InspectedArchiveEntry entries = 3;
  uint64 total_size = 4;
}
message InspectedArchiveEntry {
  uint32 index = 1;
  repeated string components = 2;
  bool directory = 3;
  uint64 size = 4;
  optional uint64 compressed_size = 5;
}
