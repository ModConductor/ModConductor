syntax = "proto3";
package modconductor.v1;
option csharp_namespace = "ModConductor.Protocol.V1";

service SkyrimSetupOperations {
  rpc ReadSkyrimSetup(ReadSkyrimSetupRequest) returns (SkyrimSetupState);
  rpc WatchSkyrimSetup(ReadSkyrimSetupRequest) returns (stream SkyrimSetupState);
  rpc StartSkyrimSetup(StartSkyrimSetupRequest) returns (SkyrimSetupState);
  rpc ContinueSkyrimSetup(SkyrimSetupRequest) returns (SkyrimSetupState);
  rpc CancelSkyrimSetup(SkyrimSetupRequest) returns (SkyrimSetupState);
  rpc OpenSkyrimSetupPage(SkyrimSetupPageRequest) returns (SkyrimSetupPageReply);
  rpc ReviewSkseRelease(SkyrimSetupRequest) returns (SkseReleaseReview);
}

message SkyrimSetupPageRequest { string component_id = 1; }
message SkyrimSetupPageReply { bool opened = 1; }

message SkyrimSetupRequest { string workspace_id = 1; string profile_id = 2; }
message ReadSkyrimSetupRequest {
  string workspace_id = 1;
  string profile_id = 2;
  SkyrimSetupSelection selection = 3;
}
message StartSkyrimSetupRequest {
  string workspace_id = 1;
  string profile_id = 2;
  SkyrimSetupSelection selection = 3;
  SkseReleaseChoice skse_choice = 4;
}
message SkseReleaseChoice {
  int64 file_id = 1;
  string component_version = 2;
  string game_version = 3;
  string game_sha256 = 4;
  bool allow_incompatible = 5;
}
message SkseReleaseReview {
  bool compatible = 1;
  string game_version = 2;
  string game_sha256 = 3;
  int64 file_id = 4;
  string component_version = 5;
  string supported_runtime = 6;
  string problem = 7;
}
enum SkyrimSetupAction {
  SKYRIM_SETUP_ACTION_UNCHANGED = 0;
  SKYRIM_SETUP_ACTION_INSTALL = 1;
  SKYRIM_SETUP_ACTION_REMOVE = 2;
  SKYRIM_SETUP_ACTION_UPDATE = 3;
}
message SkyrimSetupSelection {
  SkyrimSetupAction skse = 1;
  SkyrimSetupAction enb = 2;
  SkyrimSetupAction fnis = 3;
  string enb_archive_path = 4;
}
enum SkyrimSetupPhase {
  SKYRIM_SETUP_PHASE_UNSPECIFIED = 0;
  SKYRIM_SETUP_PHASE_UNAVAILABLE = 1;
  SKYRIM_SETUP_PHASE_AVAILABLE = 2;
  SKYRIM_SETUP_PHASE_PREPARING_DEPLOYMENT = 3;
  SKYRIM_SETUP_PHASE_SETTING_UP_SKSE = 4;
  SKYRIM_SETUP_PHASE_WAITING_FOR_SKSE = 5;
  SKYRIM_SETUP_PHASE_WAITING_FOR_ENB_ARCHIVE = 6;
  SKYRIM_SETUP_PHASE_SETTING_UP_ENB = 7;
  SKYRIM_SETUP_PHASE_SETTING_UP_FNIS = 8;
  SKYRIM_SETUP_PHASE_FNIS_STALE = 9;
  SKYRIM_SETUP_PHASE_FNIS_RUNNING = 10;
  SKYRIM_SETUP_PHASE_READY = 11;
  SKYRIM_SETUP_PHASE_RECOVERY_REQUIRED = 12;
  SKYRIM_SETUP_PHASE_FAILED = 13;
  SKYRIM_SETUP_PHASE_CANCELLED = 14;
}

message SkyrimSetupComponent {
  string name = 1;
  string status = 2;
  string detail = 3;
  bool ready = 4;
  bool active = 5;
  bool blocked = 6;
  string id = 7;
  bool installed = 8;
  string update_version = 9;
}
message SkyrimSetupState {
  SkyrimSetupPhase phase = 1;
  string status = 2;
  string detail = 3;
  repeated SkyrimSetupComponent components = 6;
  SkyrimSetupSelection selection = 7;
  bool can_start = 9;
  bool can_continue = 10;
  bool active = 12;
  bool ready = 13;
  bool can_cancel = 14;
}
